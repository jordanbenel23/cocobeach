<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0c1b20;--ink2:#16303a;--sea:#2fc7c0;--sea-deep:#0f5560;--coral:#ff6f4f;--palm:#2e5a43;
  --sand:#f4ece1;--sand2:#ebe0d1;--paper:#fbf7f1;--text:#1d2a2e;--muted:#6b7a7d;--line:rgba(12,27,32,.09);
  --gold:#c9a46a;--wa:#25d366;
  --serif:"Fraunces",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html{background:var(--sand)}
body{font-family:var(--sans);color:var(--text);background:var(--sand);max-width:480px;margin:0 auto;min-height:100vh;position:relative;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media (min-width:520px){body{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(12,27,32,.12)}}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* hero */
.hero{position:relative;padding:22px 22px 70px;color:#fff;background:var(--ink) url("../img/ext-sunset.webp") center 40%/cover no-repeat;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,27,32,.55) 0%,rgba(12,27,32,.35) 40%,rgba(12,27,32,.88) 100%)}
.hero>*{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.langs{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.lang{min-width:28px;padding:6px 6px;font-size:9.5px;font-weight:600;letter-spacing:.12em;border:1px solid rgba(255,255,255,.25);border-radius:20px;color:rgba(255,255,255,.7);transition:.2s}
.lang.on{background:#fff;border-color:#fff;color:var(--ink)}
.logo-wrap{position:relative;display:flex;justify-content:center;margin:30px 0 22px}
.logo-wrap::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:260px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(12,27,32,.55),rgba(12,27,32,0));pointer-events:none}
.logo{position:relative;display:block;width:220px;max-width:62vw;height:auto;transform:translateX(8.5%);filter:drop-shadow(0 2px 14px rgba(0,0,0,.35))}
.eyebrow{text-align:center;font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--sea);margin-bottom:10px}
.title{text-align:center;font-family:var(--serif);font-weight:300;font-size:40px;line-height:1.08}
.title em{font-style:italic;color:#ffd9c9}
.tagline{text-align:center;margin-top:12px;font-size:12.5px;color:rgba(255,255,255,.72);line-height:1.6}
.wave{position:absolute;left:0;right:0;bottom:-3px;width:100%;height:49px;display:block}

/* quick strip */
.strip{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin:-34px 16px 0;position:relative;z-index:2}
.chip{background:var(--paper);border-radius:16px;padding:12px 12px 11px;box-shadow:0 6px 24px rgba(12,27,32,.08)}
.chip small{display:block;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.chip b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink)}
.chip.wifi{background:var(--ink);color:#fff;text-align:left}
.chip.wifi small{color:var(--sea)}
.chip.wifi b{color:#fff;font-size:12px;line-height:1.25;font-family:var(--sans);font-weight:600;display:flex;align-items:center;gap:6px}
.chip.wifi svg.i{width:15px;height:15px}

/* nav */
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:22px 16px 8px}
.tile{background:var(--paper);border-radius:18px;padding:15px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid transparent;transition:transform .2s var(--ease),background .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(12,27,32,.04)}
.tile:active{transform:scale(.96)}
.tile .ic{width:42px;height:42px;border-radius:14px;background:var(--sand);display:grid;place-items:center;color:var(--sea-deep);transition:.2s}
.tile span{font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted);text-align:center;line-height:1.25}
.tile.on{background:var(--ink);box-shadow:0 8px 24px rgba(12,27,32,.22)}
.tile.on .ic{background:rgba(47,199,192,.14);color:var(--sea)}
.tile.on span{color:#fff}

/* sections */
main{padding:14px 16px 120px}
.sec{display:none;animation:up .35s var(--ease)}
.sec.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h{font-family:var(--serif);font-weight:300;font-size:30px;line-height:1.1;color:var(--ink);margin:8px 4px 4px}
.h em{font-style:italic;color:var(--sea-deep)}
.sub{font-size:12px;color:var(--muted);letter-spacing:.04em;margin:0 4px 18px}
.card{background:var(--paper);border-radius:20px;padding:18px;margin-bottom:10px;box-shadow:0 2px 14px rgba(12,27,32,.05)}
.lbl{font-size:9px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.p{font-size:13.5px;line-height:1.65;color:var(--text)}
.p+.p{margin-top:8px}
.dark{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.dark::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--sea),var(--coral))}
.dark .lbl{color:var(--sea)}
.dark .p{color:rgba(255,255,255,.78)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px}
.box small{display:block;font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:4px}
.box b{font-family:var(--serif);font-weight:300;font-size:26px}
.row{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.row:first-child{padding-top:0}
.row .ib{width:38px;height:38px;border-radius:12px;background:var(--sand);display:grid;place-items:center;color:var(--sea-deep);flex-shrink:0}
.row .ib svg.i{width:19px;height:19px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
.row .t p{font-size:12.5px;line-height:1.55;color:var(--muted)}
.dark .row{border-color:rgba(255,255,255,.08)}
.dark .row .ib{background:rgba(255,255,255,.07);color:var(--sea)}
.dark .row .t b{color:#fff}
.dark .row .t p{color:rgba(255,255,255,.6)}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.55;padding:8px 0}
ol.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--sand);color:var(--sea-deep);font-size:11px;font-weight:600;display:grid;place-items:center;flex-shrink:0;margin-top:-1px}
ul.dots{list-style:none}
ul.dots li{position:relative;padding:8px 0 8px 22px;font-size:13.5px;line-height:1.55;border-bottom:1px solid var(--line)}
ul.dots li:last-child{border-bottom:0}
ul.dots li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--sea)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px 18px;border-radius:16px;font-size:13px;font-weight:600;letter-spacing:.03em;background:var(--ink);color:#fff;margin-top:10px;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.sea{background:var(--sea-deep)}
.btn.wa{background:var(--wa);color:#073b1c}
.btn.light{background:var(--sand);color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn svg.i{width:18px;height:18px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns2 .btn{margin-top:8px}
.wifi-box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.wifi-box small{display:block;font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:3px}
.wifi-box b{font-size:16px;font-weight:600;word-break:break-all}
.copy{padding:9px 13px;border-radius:12px;background:var(--sea);color:var(--ink);font-size:11px;font-weight:600;white-space:nowrap}
.copy.ok{background:#fff}
.list a{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.list a:last-child{border-bottom:0;padding-bottom:0}
.list a:first-child{padding-top:0}
.list .ib{width:38px;height:38px;border-radius:12px;background:var(--sand);display:grid;place-items:center;color:var(--sea-deep);flex-shrink:0}
.list .ib svg.i{width:19px;height:19px}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.list .t small{font-size:11.5px;color:var(--muted)}
.list .go{color:var(--muted)}
.list .go svg.i{width:16px;height:16px}
.tag{display:inline-block;font-size:8.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);margin-left:6px;vertical-align:2px}
.amen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.am{background:var(--paper);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;font-size:12.5px;font-weight:500;color:var(--ink);box-shadow:0 2px 10px rgba(12,27,32,.04)}
.am svg.i{color:var(--sea-deep);width:19px;height:19px}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(47,199,192,.1);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--sea-deep);margin-top:10px}
.note svg.i{width:18px;height:18px;margin-top:1px}
.note.warn{background:rgba(255,111,79,.1);color:#b4472e}
.note[hidden]{display:none}
.photo{border-radius:20px;overflow:hidden;margin-bottom:10px;aspect-ratio:16/9;background:var(--sand2)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.host{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.av{width:54px;height:54px;border-radius:50%;background:var(--sand);display:grid;place-items:center;overflow:hidden}
.av img{width:38px;height:auto}
.host b{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--ink);display:block}
.host small{font-size:11.5px;color:var(--muted)}
.dark .host b{color:#fff}
.stars{display:flex;gap:4px;justify-content:center;color:var(--gold);margin:6px 0 10px}
.stars svg.i{width:20px;height:20px;fill:currentColor}
.center{text-align:center}
footer{text-align:center;padding:24px 20px 104px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);margin:0 16px}
footer img{width:150px;height:auto;opacity:.85;display:block;margin:6px auto 16px;transform:translateX(8.5%)}
.fab{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:max(18px,calc(50vw - 222px));width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(12,27,32,.28);z-index:10}
.fab svg{width:28px;height:28px;fill:#fff}
/* fridge */
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:12px;padding:12px;background:linear-gradient(120deg,var(--paper),#fff);border-color:rgba(47,199,192,.35)}
.tile.wide .ic{background:rgba(47,199,192,.14)}
.tile.wide span{font-size:12px;color:var(--ink)}
.tile.wide.on{background:var(--ink);border-color:var(--ink)}
.tile.wide.on span{color:#fff}
.fcat{font-size:9px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:20px 4px 10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.prod{background:var(--paper);border-radius:18px;padding:10px 10px 12px;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(12,27,32,.04);border:1.5px solid transparent;transition:border-color .2s}
.prod.sel{border-color:var(--sea)}
.prod.off{opacity:.5}
.pimg{aspect-ratio:1/1;border-radius:13px;background:var(--sand);display:grid;place-items:center;overflow:hidden;margin-bottom:9px;color:var(--sea-deep)}
.pimg img{width:84%;height:84%;object-fit:contain;display:block}
.pimg svg.i{width:34px;height:34px;opacity:.55}
.prod b{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3}
.prod small{font-size:10.5px;color:var(--muted);margin-top:2px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:9px}
.price{font-family:var(--serif);font-size:18px;color:var(--ink)}
.price.ask{font-family:var(--sans);font-size:10px;color:var(--muted)}
.left{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--sea-deep);margin-top:4px}
.left.out{color:var(--coral)}
.step{display:flex;align-items:center;gap:2px;background:var(--sand);border-radius:20px;padding:2px}
.step button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.step button.add{background:var(--ink);color:#fff}
.step button:disabled{opacity:.3}
.step svg.i{width:15px;height:15px;stroke-width:2}
.step em{font-style:normal;font-size:12.5px;font-weight:600;min-width:16px;text-align:center}
.olines{margin:4px 0 12px}
.oline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.ototal{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.ototal b{font-family:var(--serif);font-weight:300;font-size:28px;color:#fff}
.ototal span{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.ofields{display:grid;grid-template-columns:.9fr 1.4fr;gap:8px;margin-top:14px}
.ofields label{display:block;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:5px}
.ofields select,.ofields input{width:100%;font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
.ofields select:focus,.ofields input:focus{border-color:var(--sea)}
.ofields select option{color:var(--ink)}
.dark .note{background:rgba(47,199,192,.12);color:var(--sea)}
.dark .note.warn{background:rgba(255,111,79,.14);color:#ffb4a3}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:18px;background:var(--ink);color:#fff;box-shadow:0 14px 36px rgba(12,27,32,.35);z-index:11;font-size:13px;font-weight:600}
.cartbar .cnt{display:flex;align-items:center;gap:10px;text-align:left}
.cartbar .cnt svg.i{width:20px;height:20px;color:var(--sea)}
.cartbar small{display:block;font-size:10.5px;font-weight:500;color:rgba(255,255,255,.6)}
.cartbar .go{display:flex;align-items:center;gap:6px;color:var(--sea)}
.cartbar svg.i{width:16px;height:16px}
body.has-cart .fab{display:none}
@media (max-width:360px){.title{font-size:31px}.chip b{font-size:17px}.tile span{font-size:9.5px}}
@media (prefers-reduced-motion:reduce){.sec{animation:none}}
</style>
</head>

      <a class="btn light" href="${IG}" ${ext}>${ic("ig")}@cocobeachgt · ${c.ig}</a></div>
    <a class="btn" href="${MAP}" ${ext}>${ic("pin")}${c.map} · Google Maps</a>
    <div class="card center" style="margin-top:10px"><p class="lbl">${c.rev}</p>
      <div class="stars">${ic("star").repeat(5)}</div><p class="p" style="color:var(--muted)">${c.revD}</p>
      <div class="btns2" style="grid-template-columns:1fr 1fr 1fr"><a class="btn light" href="${REVIEW.google}" ${ext}>Google</a><a class="btn light" href="${REVIEW.airbnb}" ${ext}>Airbnb</a><a class="btn light" href="${REVIEW.booking}" ${ext}>Booking</a></div></div>`;

  S.fridge = fridgeHTML();
  document.getElementById("main").innerHTML = NAV.map(([k]) => `<section class="sec${k === current ? " on" : ""}" id="s-${k}">${S[k]}</section>`).join("");
  renderCartBar();
}

/* ---------- Nevera ---------- */
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const money = v => "Q" + (Math.round(v * 100) / 100).toFixed(v % 1 ? 2 : 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => { const s = String(v || "").replace(/[^\d.,]/g, "").replace(",", "."); return s === "" || isNaN(+s) ? null : +s; };

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function fromSheet(text) {
  const rows = parseCSV(text).filter(r => r.some(c => c.trim()));
  if (rows.length < 2) return null;
  const h = rows[0].map(norm), col = k => h.findIndex(x => x.startsWith(k));
  const c = { id: col("id"), cat: col("categ"), n: col("producto"), size: col("tama"), price: col("precio"), qty: col("cantidad") };
  if (c.n < 0) return null;
  const list = rows.slice(1).map(r => ({
    id: (c.id >= 0 && r[c.id].trim()) || norm(r[c.n]).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""),
    cat: c.cat >= 0 ? r[c.cat].trim() : "", n: r[c.n].trim(), size: c.size >= 0 ? r[c.size].trim() : "",
    price: c.price >= 0 ? num(r[c.price]) : null, qty: c.qty >= 0 ? num(r[c.qty]) : null
  })).filter(p => p.n);
  return list.length ? list : null;
}

async function loadFridge() {
  try { const c = JSON.parse(localStorage.getItem("cb-fridge") || "null"); if (Array.isArray(c) && c.length) fridge = c; } catch (_) {}
  try { const o = JSON.parse(localStorage.getItem("cb-order") || "null"); if (o) order = { room: o.room || "", name: o.name || "" }; } catch (_) {}
  try {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw 0;
    const list = fromSheet(await r.text());
    if (list) { fridge = list; try { localStorage.setItem("cb-fridge", JSON.stringify(list)); } catch (_) {} }
  } catch (_) {}
  for (const id in cart) { const p = fridge.find(x => x.id === id); if (!p || p.qty === 0) delete cart[id]; else if (p.qty != null && cart[id] > p.qty) cart[id] = p.qty; }
  renderFridge();
}

function fridgeHTML() {
  const t = T[lang].fridge;
  const groups = [];
  fridge.forEach(p => { let g = groups.find(x => x.cat === p.cat); if (!g) groups.push(g = { cat: p.cat, items: [] }); g.items.push(p); });
  const catName = c => t.cats[CAT_KEYS[norm(c)]] || c;
  const card = p => {
    const q = cart[p.id] || 0, out = p.qty === 0, max = p.qty == null ? 99 : p.qty;
    return `<div class="prod${q ? " sel" : ""}${out ? " off" : ""}">
      <div class="pimg"><img src="../img/nevera/${encodeURIComponent(p.id)}.png" alt="" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment('${ic("bottle").replace(/"/g, "&quot;")}'))"></div>
      <b>${esc(p.n)}</b><small>${esc(p.size)}</small>
      ${out ? `<span class="left out">${t.out}</span>` : (p.qty != null ? `<span class="left">${t.left.replace("{n}", p.qty)}</span>` : "")}
      <div class="pfoot">${p.price != null ? `<span class="price">${money(p.price)}</span>` : `<span class="price ask">${t.ask}</span>`}
        <div class="step">${q ? `<button type="button" data-dec="${esc(p.id)}" aria-label="−">${ic("minus")}</button><em>${q}</em>` : ""}<button class="add" type="button" data-inc="${esc(p.id)}" aria-label="+"${out || q >= max ? " disabled" : ""}>${ic("add")}</button></div></div>
    </div>`;
  };
  const lines = fridge.filter(p => cart[p.id]);
  const total = lines.reduce((s, p) => s + (p.price || 0) * cart[p.id], 0);
  const unpriced = lines.some(p => p.price == null);
  const orderCard = lines.length ? `
    <div class="olines">${lines.map(p => `<div class="oline"><span>${cart[p.id]} × ${esc(p.n)}</span><span>${p.price != null ? money(p.price * cart[p.id]) : "—"}</span></div>`).join("")}</div>
    <div class="ototal"><span>${t.total}</span><b>${lines.some(p => p.price != null) ? money(total) : "—"}</b></div>
    ${unpriced ? `<div class="note">${ic("info")}<span>${t.noPrice}</span></div>` : ""}
    <div class="ofields"><div><label for="fRoom">${t.room}</label><select id="fRoom"><option value="">${t.pick}</option>${ROOMS.map(r => `<option${r === order.room ? " selected" : ""}>${r}</option>`).join("")}</select></div>
      <div><label for="fName">${t.name}</label><input id="fName" type="text" autocomplete="given-name" maxlength="40" value="${esc(order.name)}"></div></div>
    <div class="note warn" id="fNeed" hidden>${ic("warn")}<span>${t.need}</span></div>
    <button class="btn wa" type="button" id="fSend">${ic("wa")}${t.send}</button>`
    : `<p class="p" style="color:rgba(255,255,255,.6)">${t.empty}</p>`;
  return head(t.h, t.sub) + `
    <div class="card"><p class="lbl">${t.how}</p><ol class="steps">${t.steps.map(x => `<li>${x}</li>`).join("")}</ol></div>
    ${groups.map(g => `<p class="fcat">${esc(catName(g.cat))}</p><div class="fgrid">${g.items.map(card).join("")}</div>`).join("")}
    <div class="card dark" id="fOrder" style="margin-top:18px"><p class="lbl">${t.order}</p>${orderCard}</div>
    <div class="note" id="fSent" hidden>${ic("palm")}<span>${t.sent}</span></div>`;
}

function renderCartBar() {
  const t = T[lang].fridge;
  const lines = fridge.filter(p => cart[p.id]);
  const n = lines.reduce((s, p) => s + cart[p.id], 0), total = lines.reduce((s, p) => s + (p.price || 0) * cart[p.id], 0);
  let bar = document.getElementById("cartbar");
  if (!n || current !== "fridge") { if (bar) bar.remove(); document.body.classList.remove("has-cart"); return; }
  if (!bar) { bar = document.createElement("button"); bar.id = "cartbar"; bar.className = "cartbar"; bar.type = "button"; document.body.appendChild(bar); }
  bar.innerHTML = `<span class="cnt">${ic("cart")}<span>${n}${lines.some(p => p.price != null) ? " · " + money(total) : ""}<small>${t.order}</small></span></span><span class="go">${t.view}${ic("arrow")}</span>`;
  document.body.classList.add("has-cart");
}

function renderFridge() {
  const sec = document.getElementById("s-fridge");
  if (sec) sec.innerHTML = fridgeHTML();
  renderCartBar();
}

function sendOrder() {
  const lines = fridge.filter(p => cart[p.id]);
  if (!lines.length) return;
  if (!order.room) { document.getElementById("fNeed").hidden = false; document.getElementById("fRoom").focus(); return; }
  const total = lines.reduce((s, p) => s + (p.price || 0) * cart[p.id], 0);
  const msg = [`Nevera · Habitación ${order.room}${order.name ? " · " + order.name.trim() : ""}`, ""]
    .concat(lines.map(p => `${cart[p.id]} × ${p.n} ${p.size}${p.price != null ? " · " + money(p.price * cart[p.id]) : ""}`))
    .concat(["", `Total: ${money(total)}${lines.some(p => p.price == null) ? " + productos sin precio" : ""}`]).join("\n");
  window.open(wa(WA, msg), "_blank", "noopener");
  cart = {};
  renderFridge();
  const s = document.getElementById("fSent"); if (s) { s.hidden = false; s.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function show(k, scroll) {
  if (!T.es.nav[k]) k = "arrive";
  current = k;
  document.querySelectorAll(".tile").forEach(el => el.classList.toggle("on", el.dataset.s === k));
  document.querySelectorAll(".sec").forEach(el => el.classList.toggle("on", el.id === "s-" + k));
  try { history.replaceState(null, "", "#" + k); } catch (e) {}
  renderCartBar();
  if (k === "fridge") loadFridge();
  if (scroll) document.getElementById("main").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); }
  if (btn) { const old = btn.innerHTML; btn.classList.add("ok"); btn.textContent = T[lang].wifi.ok; setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = old; }, 1600); }
}

document.addEventListener("click", e => {
  const l = e.target.closest("[data-l]");
  if (l) { lang = l.dataset.l; try { localStorage.setItem("cb-lang", lang); } catch (_) {} render(); return; }
  const s = e.target.closest("[data-s]");
  if (s) { show(s.dataset.s, true); return; }
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc || dec) { const id = (inc || dec).dataset[inc ? "inc" : "dec"]; cart[id] = Math.max(0, (cart[id] || 0) + (inc ? 1 : -1)); if (!cart[id]) delete cart[id]; renderFridge(); return; }
  if (e.target.closest("#fSend")) { sendOrder(); return; }
  if (e.target.closest("#cartbar")) { document.getElementById("fOrder").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const c = e.target.closest("[data-copy]");
  if (c) { copy(c.dataset.copy, c); return; }
  if (e.target.closest("#wifiChip")) { const b = document.querySelector("#wifiChip span"); copy(WIFI.pass); b.textContent = T[lang].wifi.ok; setTimeout(() => { b.textContent = T[lang].strip.wifi; }, 1600); }
});

const saveOrder = () => { try { localStorage.setItem("cb-order", JSON.stringify(order)); } catch (_) {} };
document.addEventListener("change", e => { if (e.target.id === "fRoom") { order.room = e.target.value; saveOrder(); const n = document.getElementById("fNeed"); if (n && order.room) n.hidden = true; } });
document.addEventListener("input", e => { if (e.target.id === "fName") { order.name = e.target.value; saveOrder(); } });

(function init() {
  let saved = null;
  try { saved = localStorage.getItem("cb-lang"); } catch (_) {}
  const nav = (navigator.language || "es").slice(0, 2).toLowerCase();
  lang = LANGS.includes(saved) ? saved : (LANGS.includes(nav) ? nav : "es");
  const h = location.hash.slice(1);
  if (T.es.nav[h]) current = h;
  render();
  loadFridge();
})();
</script>
